services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: medlock-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medlock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-medlock}
    volumes:
      - medlock_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medlock} -d ${POSTGRES_DB:-medlock}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  medlock_pgdata:
